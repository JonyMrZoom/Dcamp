services:
  - type: web
    name: delo-ritma
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: delo-ritma-db
          property: connectionString
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: TG_BOT_TOKEN
        sync: false
      - key: TG_CHAT_ID
        sync: false

databases:
  - name: delo-ritma-db
    databaseName: delo_ritma
    user: delo_ritma
    plan: basic-256mb
    region: frankfurt
    postgresMajorVersion: "18"
