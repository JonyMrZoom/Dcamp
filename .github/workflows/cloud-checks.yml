name: Cloud platform checks
on:
  push:
    branches: [cloud-platform]
  pull_request:
    branches: [cloud-platform]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run check
